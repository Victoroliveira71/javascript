<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual seu nome?')
        document.write(`Olá, ${nome}! seu nome tem ${nome.length} letras. <br/>`)
        document.write(`Seu nome em letras maiusculas ${nome.toUpperCase()} <br/>`)
        document.write(`Seu nome em letras minusculas ${nome.toLowerCase()}`)
        var salario =1900.7
        var bonus = 400.6
        var real = salario + bonus
        window.alert(`Seu salario teve um aumento de ${bonus}, saiu de ${salario} para ${real}`)
    </script>
</body>
</html>
