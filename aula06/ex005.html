<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: rgb(82, 88, 204);
            color: white;
            font: normal 18pt arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos DOM</h1>
    <p class="smg">Aqui vai o resutado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em Javascript</p>
    <div id="caixa1">Clique aqui</div>

    <script>
        var corpo = window.document.body
        corpo.style.background='darkblue'
        corpo.style.color='pink'
        var p1 = window.document.getElementsByTagName('p')[1]
        window.document.write(p1.innerHTML)
        var p2 = window.document.getElementsByClassName('smg')[0]
        p2.style.background='green'
        var p2 = window.document.getElementById('caixa1')
        p2.style.color='red' 
    </script>
</body>
</html>
