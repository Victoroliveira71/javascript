<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
    <style>
        #area{
            background-color: rgb(29, 161, 29);
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()">
        Clique aqui...
    </div>

    <script>
        function clicar() {
            var a = window.document.getElementById('area')
            a.innerText='Clicou!'
            a.style.background='green'
        }
    </script>
</body>
</html>
