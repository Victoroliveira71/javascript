<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
    <style>
        #room{
            background-color:green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            font-size: 2em;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="room" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">
        Clique aqui...
    </div>

    <script>
         var A = window.document.getElementById('room')

        function clicar(){
            A.innerText='Clicou!'
            A.style.background= 'red'
        }
        function entrar(){
            A.innerText='Entrou'
        }
        function sair(){
            A.innerText='Saiu'
            A.style.background='green'
        }
    </script>
</body>
</html>
